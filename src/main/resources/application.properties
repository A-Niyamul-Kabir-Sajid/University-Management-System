spring.application.name=university-management-system
server.port=8080

# Database: defaults to in-memory H2 so `mvn spring-boot:run` works with zero setup.
# Docker Compose overrides these with environment variables to use PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:umsdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Default admin account created on first start (change these in production!)
app.admin.name=${ADMIN_NAME:System Admin}
app.admin.email=${ADMIN_EMAIL:admin@ums.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Creates one demo teacher and one demo student so you can test RBAC quickly
app.seed-demo-data=${SEED_DEMO_DATA:true}
